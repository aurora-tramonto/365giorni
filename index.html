<style>:root{color-scheme:light dark;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Dall'Aurora al Tramonto</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* layout: colonna stretta e ariosa. Il giorno come arco di luce: alba rosata, mezzogiorno oro, tramonto indaco. Un solo accento, movimento lento. */
:root{
  --bg:#F5F4F0; --surface:#FFFFFF; --ink:#1F2421; --soft:#6C716C; --faint:#A9ADA6;
  --line:#E4E3DC; --line-soft:#EDECE6; --accent:#B7791F; --ok:#3E6B52; --ok-bg:#E5EFE8; --part:#E8C671; --warn:#B3401F;
  --dawn:#E58E7A; --noon:#E5B04B; --dusk:#6A6FB8;
  --display:"Instrument Serif",Georgia,"Times New Roman",serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1C201D; --ink:#EEF0EA; --soft:#9AA09A; --faint:#5F655F; --line:#2D332F; --line-soft:#242925;
  --accent:#E0A94E; --ok:#8FC6A1; --ok-bg:#1F2D24; --part:#8a6a26; --warn:#E5805F; --dawn:#E58E7A; --dusk:#8A8FDB; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1C201D; --ink:#EEF0EA; --soft:#9AA09A; --faint:#5F655F; --line:#2D332F; --line-soft:#242925;
  --accent:#E0A94E; --ok:#8FC6A1; --ok-bg:#1F2D24; --part:#8a6a26; --warn:#E5805F; --dawn:#E58E7A; --dusk:#8A8FDB; color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;margin:0;
  padding-block:28px 56px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));min-height:100vh}
.wrap{max-width:600px;margin:0 auto}
.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}
h1{font:400 30px/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 small{display:block;font:500 11px var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--soft);margin-top:8px}
.brand{display:flex;gap:14px;align-items:center}
.logo{flex:none}
.ld{transform-box:fill-box;transform-origin:center;animation:ldin .8s var(--ease) both}.l1{animation-delay:.15s}.l2{animation-delay:.3s}
@keyframes ldin{from{opacity:0;transform:scale(.2)}to{opacity:1;transform:scale(1)}}
.pct{font:400 46px/1 var(--display);font-variant-numeric:tabular-nums;text-align:right}
.pct sup{font-size:20px;color:var(--soft);margin-left:2px;vertical-align:top;line-height:1.5}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--dawn),var(--noon),var(--dusk));border-radius:3px;transition:width 1.1s var(--ease)}
.barlab{font-size:12px;color:var(--soft);margin:7px 0 22px;font-variant-numeric:tabular-nums}
.tabs{display:flex;position:relative;margin-bottom:22px;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:none;padding:11px 2px;font:500 13.5px var(--body);color:var(--faint);cursor:pointer;transition:color .25s}
.tabs button[aria-selected="true"]{color:var(--ink)}
.tabs button:hover{color:var(--ink)}
.tabs .ind{position:absolute;bottom:-1px;height:2px;background:var(--ink);border-radius:2px;transition:transform .45s var(--ease),width .45s var(--ease);left:0}
.streakrow{display:flex;gap:24px;align-items:baseline;margin-bottom:6px;font-size:12.5px;color:var(--soft)}
.streakrow b{font:400 26px var(--display);color:var(--ink);margin-right:5px;font-variant-numeric:tabular-nums}
.flame{display:inline-block;filter:grayscale(1);opacity:.4;transition:all .4s}.flame.on{filter:none;opacity:1;animation:flick 3s ease-in-out infinite}
@keyframes flick{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.08) rotate(-4deg)}}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:18px;padding:2px 20px;margin-bottom:16px}
.row{display:flex;gap:16px;padding:20px 0;border-top:1px solid var(--line-soft)}
.row:first-child{border-top:none}
.row .b{flex:1;min-width:0}
.lab{font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--soft);display:flex;gap:9px;align-items:center}
.lab .n{letter-spacing:.02em;color:var(--faint);font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;flex:none}.d0{background:var(--dawn)}.d1{background:var(--noon)}.d2{background:var(--dusk)}
.lab .lnk{margin-left:auto;text-transform:none;letter-spacing:0}
.ref{font:400 27px/1.15 var(--display);margin:6px 0 14px;overflow-wrap:anywhere;position:relative;display:inline-block;transition:color .4s,opacity .4s}
.ref::after{content:"";position:absolute;left:0;top:55%;height:1.5px;width:100%;background:var(--ok);transform:scaleX(0);transform-origin:left;transition:transform .5s var(--ease)}
.row.done .ref{color:var(--ok);opacity:.7}.row.done .ref::after{transform:scaleX(1)}
.chk{appearance:none;-webkit-appearance:none;width:30px;height:30px;flex:none;margin:2px 0 0;border:1.5px solid var(--faint);border-radius:50%;cursor:pointer;position:relative;transition:all .3s var(--ease);background:transparent}
.chk::after{content:"";position:absolute;left:9px;top:5px;width:7px;height:12px;border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);transition:transform .3s var(--ease)}
.chk:hover{border-color:var(--ok)}
.chk:checked{background:var(--ok);border-color:var(--ok);animation:pop .4s var(--ease)}
.chk:checked::after{transform:rotate(45deg) scale(1)}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.nav{display:flex;gap:8px}
.btn{padding:9px 13px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font:500 13px var(--body);cursor:pointer;transition:all .25s var(--ease)}
.btn:hover:not(:disabled){border-color:var(--ink);color:var(--ink)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.3;cursor:default}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover:not(:disabled){opacity:.85;color:var(--bg)}
.btn.full{flex:1}
.btn:focus-visible,.tabs button:focus-visible,.chk:focus-visible,.cell:focus-visible,.ch:focus-visible,.pr:focus-visible,.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:none;color:var(--soft);font:500 12px var(--body);padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line);transition:color .2s}
.link:hover{color:var(--ink)}
.edit{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:10px;animation:fadeUp .35s var(--ease)}
.edit .f{display:flex;gap:8px;align-items:center}
.edit label{font-size:12px;color:var(--soft);flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],textarea{font:16px var(--body);padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);min-width:0;transition:border-color .2s}
input[type=text]:focus,input[type=number]:focus,textarea:focus{outline:none;border-color:var(--ink)}
input[type=text]{flex:1}input[type=number]{width:72px}
.msg{font-size:12.5px;color:var(--soft);min-height:18px}.msg.err{color:var(--warn)}
h2{font:400 22px var(--display);margin:30px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:6px}
.stat{background:var(--surface);border:1px solid var(--line-soft);border-radius:16px;padding:16px 10px;text-align:center}
.stat b{display:block;font:400 32px/1 var(--display);font-variant-numeric:tabular-nums;margin-bottom:5px}.stat span{font-size:11.5px;color:var(--soft)}
.book{padding:15px 0;border-top:1px solid var(--line-soft)}
.book:first-of-type{border-top:none}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:9px}
.bh b{font:400 19px var(--display)}
.bh span{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums}
.bh.done b{color:var(--ok)}
.chs{display:flex;flex-wrap:wrap;gap:4px}
.ch{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);background:transparent;padding:0;cursor:pointer;transition:transform .2s var(--ease),background .3s,border-color .3s}
.ch:hover{transform:scale(1.35);border-color:var(--ink)}
.ch.f{background:var(--ok);border-color:var(--ok)}.ch.p{background:var(--part);border-color:var(--part)}
.bacts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.bacts:empty{display:none}
.ibtn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font:500 12px var(--body);cursor:pointer;transition:all .2s var(--ease)}.ibtn:hover{border-color:var(--ink);color:var(--ink)}.ibtn.warn:hover{border-color:var(--warn);color:var(--warn)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--ok-bg);border-radius:12px;padding:10px 12px;font-size:13px;width:100%}.confirm span{flex:1;min-width:180px}
.toast{position:fixed;left:50%;bottom:max(18px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:999px;font-size:13px;display:flex;gap:14px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25);z-index:20;animation:fadeUp .35s var(--ease);max-width:calc(100vw - 32px)}.toast button{background:none;border:none;color:var(--bg);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:0}
.legend{display:flex;gap:16px;font-size:12px;color:var(--soft);margin:0 0 14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;vertical-align:-1px;margin-right:6px;border:1.5px solid var(--line)}
.cal{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:4px;overflow-x:auto;padding:4px 2px 8px}
.cell{width:18px;height:18px;border-radius:5px;border:none;background:var(--line-soft);padding:0;cursor:pointer;transition:transform .2s var(--ease),background .3s}
.cell:hover:not(:disabled){transform:scale(1.25)}
.cell.on{background:var(--ok)}.cell.today{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--ink)}.cell.fut{opacity:.25;cursor:default}
.plist{max-height:440px;overflow-y:auto;border:1px solid var(--line-soft);border-radius:16px;background:var(--surface)}
.pr{display:flex;gap:12px;padding:11px 16px;border:none;border-bottom:1px solid var(--line-soft);font:14px var(--body);cursor:pointer;background:none;width:100%;text-align:left;color:var(--ink);transition:background .2s}
.pr:hover{background:var(--line-soft)}
.pr .n{color:var(--faint);width:34px;flex:none;font-variant-numeric:tabular-nums}
.pr.d{color:var(--ok)}.pr.c{background:var(--ok-bg);font-weight:600}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg .btn{flex:1}.seg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{width:100%;font:11px monospace;resize:vertical}
.err-banner{background:var(--warn);color:#fff;padding:8px 12px;border-radius:10px;font:12px monospace;white-space:pre-wrap;margin-bottom:12px}
.foot{margin-top:34px;padding-top:22px;border-top:1px solid var(--line);text-align:center;color:var(--soft);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.foot p{margin:0;max-width:46ch;text-wrap:balance}.foot b{color:var(--ink);font-weight:600}.foot svg{color:var(--ink);margin-bottom:4px}
.nudge{font-size:12.5px;color:var(--soft);background:var(--ok-bg);border-radius:12px;padding:10px 14px;margin:6px 0 14px}
.save{font-size:11.5px;color:var(--faint);text-align:center;margin-top:28px}
@media (min-width:880px){
  body{padding-block:44px 64px}
  .wrap{max-width:1040px}

  .logo{width:56px;height:56px}
  .tabs{max-width:560px}
  .card.today{display:grid;grid-template-columns:repeat(3,1fr);padding:0;overflow:hidden}

  .ref{font-size:32px}
  .card.books{columns:2;column-gap:56px;padding:6px 28px}
  .book{break-inside:avoid}
  .stats{max-width:620px}
  .cell{width:22px;height:22px}
  .cal{gap:5px}
  .plist{max-height:560px}
  .seg{max-width:420px}
  .card[style*="padding:14px"]{max-width:620px}
}
@media (min-width:880px){.streakrow{margin-bottom:14px}}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

main.enter>*:nth-child(2){animation-delay:.06s}main.enter>*:nth-child(3){animation-delay:.12s}main.enter>*:nth-child(4){animation-delay:.18s}

main.enter .stat:nth-child(2){animation-delay:.07s}main.enter .stat:nth-child(3){animation-delay:.14s}
main.enter .ch,main.enter .cell{animation:fadeUp .5s var(--ease) both}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

  if(sel&&ind){ind.style.width=sel.offsetWidth+"px";ind.style.transform="translateX("+sel.offsetLeft+"px)";}
}
function renderTop(){
  computeCov();
  var tot=0,full=0;BOOKS.forEach(function(b){var s=bookStats(b);tot+=s.n;full+=S.rr[b]?s.n:s.f;});
  var pct=Math.round(full/tot*1000)/10;
  setTimeout(function(){document.getElementById("barfill").style.width=pct+"%";},30);
  document.getElementById("barText").textContent=full+" di "+tot+" capitoli letti";
  countTo(document.getElementById("barPct"),pct);
  if(!tabsBuilt){var h="";TABS.forEach(function(x){h+='<button role="tab" data-tab="'+x[0]+'">'+x[1]+'</button>';});
    document.getElementById("tabs").innerHTML=h+'<span class="ind" id="ind"></span>';tabsBuilt=true;}
  document.querySelectorAll("#tabs button").forEach(function(b){b.setAttribute("aria-selected",String(b.dataset.tab===tab));});
  placeInd();
}
window.addEventListener("resize",placeInd);
function backupNudge(){
  var last=+(lsGet("dat5_lastfile")||0),days=(Date.now()-last)/864e5;
  if(last&&days<21)return '';
  return '<div class="nudge">Non hai ancora un file di backup'+(last?' da '+Math.floor(days)+' giorni':'')+'. <button class="link" data-tab="dati">Salvalo ora</button></div>';
}
function viewOggi(){
  var st=streaks(),h='<div class="streakrow"><span><span class="flame'+(st.cur?' on':'')+'">🔥</span> <b>'+st.cur+'</b>di fila</span><span>record <b>'+st.best+'</b></span></div>'+backupNudge()+'<div class="card today">';
  for(var t=0;t<3;t++){
    var i=S["v"+t],d=isDone(t,i),n=TR[t].length;
    h+='<div class="row'+(d?' done':'')+'"><input type="checkbox" class="chk" data-chk="'+t+'" id="chk'+t+'" aria-label="Segna '+NAMES[t]+' come letto"'+(d?' checked':'')+'><div class="b">'+
      '<div class="lab"><i class="dot d'+t+'"></i>'+NAMES[t]+'<span class="n">'+(i+1)+'/'+n+'</span><button class="link lnk" data-edit="'+t+'">'+(editOpen[t]?'Chiudi':'Modifica')+'</button></div>'+
      '<div class="ref">'+esc(curRef(t,i))+'</div>'+
      '<div class="nav"><button class="btn full" data-nav="'+t+'" data-d="-1"'+(i===0?' disabled':'')+'>‹ precedente</button><button class="btn full" data-nav="'+t+'" data-d="1"'+(i>=n-1?' disabled':'')+'>successiva ›</button></div>';
    if(editOpen[t]){
      h+='<div class="edit"><div class="f"><label for="go'+t+'">Salta a un altro punto del piano</label><small style="color:var(--soft);display:block;margin-top:2px">Se hai letto per conto tuo o ti sei perso, scrivi dove vuoi riprendere (es. Isaia 22 o Galati 5:1). Sposta solo il segnaposto: non segna nulla come letto.</small></div><div class="f"><input type="text" id="go'+t+'" placeholder="Libro capitolo:versetto"><button class="btn pri" data-go="'+t+'">Salta qui</button></div>'+
        '<div class="f"><label for="sv'+t+'">Non ho finito: mi sono fermato al versetto</label><input type="number" id="sv'+t+'" min="1" inputmode="numeric"><button class="btn pri" data-split="'+t+'">Conferma</button></div>'+
        (S.ovr[t+":"+i]?'<div class="f"><button class="link" data-unsplit="'+t+'">Annulla la divisione di questa lettura</button></div>':'')+
        '<div class="msg'+(/^!/.test(msgs[t])?' err':'')+'">'+esc(msgs[t].replace(/^!/,''))+'</div></div>';
    }
    h+='</div></div>';
  }
  return h+'</div><p class="msg">Spunta quando hai letto, poi usa i pulsanti per cambiare lettura. Ognuna delle tre va per conto suo.</p>';
}
function viewLibri(){
  var h='<div class="legend"><span><i style="background:var(--ok)"></i>letto</span><span><i style="background:var(--part)"></i>in parte</span><span><i></i>da leggere</span><span>tocca un capitolo per segnarlo come già letto</span></div>';
  var at=0,atN=0,nt=0,ntN=0;
  BOOKS.forEach(function(b,bi){var s=bookStats(b),f=S.rr[b]?s.n:s.f;if(bi<NT0){at+=f;atN+=s.n}else{nt+=f;ntN+=s.n}});
  h+='<div class="stats"><div class="stat"><b>'+Math.round(at/atN*100)+'%</b><span>Antico Testamento</span></div><div class="stat"><b>'+Math.round(nt/ntN*100)+'%</b><span>Nuovo Testamento</span></div><div class="stat"><b>'+BOOKS.filter(function(b){var s=bookStats(b);return S.rr[b]||s.f===s.n}).length+'</b><span>libri finiti</span></div></div>';
  [["Antico Testamento",0,NT0],["Nuovo Testamento",NT0,BOOKS.length]].forEach(function(g){
    h+='<h2>'+g[0]+'</h2><div class="card books">';
    for(var bi=g[1];bi<g[2];bi++){var b=BOOKS[bi],s=bookStats(b);
      var rr=S.rr[b],fin=s.f===s.n,acts='',any=(s.f+s.p>0)||rr;
      if(confB===b){acts='<div class="confirm" role="alertdialog"><span>Azzerare <b>'+esc(b)+'</b>? Tutti i suoi capitoli tornano da leggere.</span><button class="btn pri" data-clear-yes="'+esc(b)+'">Sì, azzera</button><button class="btn" data-clear-no="1">No</button></div>';}
      else{
        if(!fin)acts+='<button class="ibtn" data-all="'+esc(b)+'"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M5.2 8.2l2 2 3.6-4"/></svg><span>tutto letto</span></button>';
        if(fin)acts+='<button class="ibtn" data-reread="'+esc(b)+'"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 7a5 5 0 0 0-9-2.5L3 6M3 3v3h3M3 9a5 5 0 0 0 9 2.5L13 10M13 13v-3h-3"/></svg><span>rileggi</span></button>';
        if(rr)acts+='<button class="ibtn" data-unre="'+esc(b)+'"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5h6a3.5 3.5 0 0 1 0 7H6M3.5 6.5L6 4M3.5 6.5L6 9"/></svg><span>annulla rilettura</span></button>';
        if(any)acts+='<button class="ibtn warn" data-clear="'+esc(b)+'"><svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 6.5h6a3.5 3.5 0 0 1 0 7H6M3.5 6.5L6 4M3.5 6.5L6 9"/></svg><span>annulla lettura</span></button>';
      }
      h+='<div class="book"><div class="bh'+((rr||fin)?' done':'')+'"><b>'+esc(b)+((rr||fin)?' ✓':'')+(rr?' · giro '+(rr.n+1):'')+'</b><span>'+s.f+'/'+s.n+'</span></div><div class="chs">';
      COV[b].forEach(function(x,ci){h+='<button class="ch'+(x===2?' f':x===1?' p':'')+'" data-ch="'+esc(b)+'" data-c="'+(ci+1)+'" aria-label="'+esc(b)+' '+(ci+1)+'"></button>';});
      h+='</div><div class="bacts">'+acts+'</div></div>';}
    h+='</div>';});
  return h;
}
function fmtIT(iso){return iso.split("-").reverse().join("/");}
function viewSerie(){
  var st=streaks(),today=todayISO(),set={};S.act.forEach(function(d){set[d]=1;});
  var dow=(new Date(today+"T12:00:00").getDay()+6)%7,weeks=17,start=addDays(today,-(weeks*7-1-(6-dow)));
  var cells="";for(var k=0;k<weeks*7;k++){var d=addDays(start,k),fut=d>today;
    cells+='<span class="cell'+(set[d]?' on':'')+(d===today?' today':'')+(fut?' fut':'')+'" title="'+fmtIT(d)+'" aria-label="'+fmtIT(d)+(set[d]?' letto':'')+'" style="cursor:default"></span>';}
  var last30=0;for(var q=0;q<30;q++)if(set[addDays(today,-q)])last30++;
  var since=S.start?'<p class="msg">Hai iniziato il <b>'+fmtIT(S.start)+'</b> · giorno <b>'+(Math.round((new Date(today+"T12:00:00")-new Date(S.start+"T12:00:00"))/864e5)+1)+'</b> del cammino.</p>':'';
  return '<div class="stats"><div class="stat"><b>'+st.cur+'</b><span>giorni di fila</span></div><div class="stat"><b>'+st.best+'</b><span>record</span></div><div class="stat"><b>'+last30+'/30</b><span>ultimi 30 giorni</span></div></div>'+since+
    '<h2>Calendario</h2><div class="cal">'+cells+'</div><p class="msg">'+st.total+' giorni letti in tutto. Si colora da solo quando segni una lettura. Ogni riga è un giorno della settimana (lunedì in alto).</p>'+
    '<div class="card" style="padding:14px"><h2 style="margin-top:0">Sistema la tua serie</h2><p class="msg">Se l’app non aveva registrato i tuoi giorni: indica quando hai iniziato e l’app segna come letti tutti i giorni da allora fino a ieri (presume che tu abbia letto ogni giorno). Oppure scrivi da quanti giorni leggi di fila. Se sbagli, usa “Annulla” nel messaggio in basso.</p>'+
    '<div class="f edit" style="border:none;padding:0"><div class="f"><label for="stDate">Ho iniziato a leggere il</label><input type="date" id="stDate" max="'+today+'" value="'+(S.start||'')+'"><button class="btn pri" data-setstart="1">Salva</button></div>'+
    '<div class="f"><label for="stN">Leggo di fila da (giorni, fino a ieri)</label><input type="number" id="stN" min="1" max="400" inputmode="numeric" placeholder="es. 12"><button class="btn pri" data-setstreak="1">Imposta</button></div>'+
    '<div class="msg'+(/^!/.test(serieMsg)?' err':'')+'">'+esc(serieMsg.replace(/^!/,''))+'</div></div></div>';
}
function viewPiano(){
  var t=planTrack,h='<div class="seg">';NAMES.forEach(function(n,i){h+='<button class="btn" data-pt="'+i+'" aria-pressed="'+(i===t)+'">'+n+'</button>';});
  h+='</div><div class="plist" id="plist">';
  TR[t].forEach(function(r,i){var c=i===S["v"+t],d=isDone(t,i);h+='<button class="pr'+(d?' d':'')+(c?' c':'')+'" data-pi="'+i+'"><span class="n">'+(i+1)+'</span><span>'+(d?'✓ ':'')+esc(curRef(t,i))+'</span></button>';});
  return h+'</div><p class="msg">Tocca una riga per portare qui la lettura.</p>';
}
function snapList(){
  var l=readSnaps().slice().reverse();if(!l.length)return '<div class="msg">Nessuna copia ancora. La prima arriva al prossimo salvataggio.</div>';
  return l.map(function(x){var n=0;[0,1,2].forEach(function(t){n+=(x.s["d"+t]||[]).length});
    return '<div class="f edit" style="border:none;padding:6px 0;animation:none"><div class="f"><label style="font-size:13px;color:var(--ink)">'+x.d.split("-").reverse().join("/")+' <span style="color:var(--soft)">· '+n+' letture, '+((x.s.act||[]).length)+' giorni</span></label><button class="btn" data-snap="'+x.d+'">Ripristina</button></div></div>';}).join('');
}
function viewDati(){
  return '<div class="card" style="padding:14px"><h2 style="margin-top:0">Copia di sicurezza</h2><p class="msg">Il tuo avanzamento è salvato nel browser e, quando possibile, anche nel cloud. Per essere tranquillo copia il codice ogni tanto e conservalo in Note.</p>'+
    '<div class="f edit" style="border:none;padding:0"><div class="f"><button class="btn pri full" id="bkOut">Genera codice</button><button class="btn full" id="bkIn">Ripristina da codice</button></div>'+
    '<textarea id="bkText" rows="4" placeholder="Il codice appare qui. Per ripristinare, incolla qui il codice (o il contenuto del file di backup) e premi Ripristina."></textarea><div class="msg" id="bkMsg"></div></div></div>'+
    '<div class="card" style="padding:14px"><h2 style="margin-top:0">Salvataggi automatici</h2><p class="msg">Ogni giorno l’app tiene una copia dei tuoi progressi (le ultime 14). Se qualcosa si rovina, scegli una data e ripristina, senza codici.</p>'+snapList()+'</div>'+
    '<div class="card" style="padding:14px"><h2 style="margin-top:0">File di backup</h2><p class="msg">Salva un file sul tuo dispositivo. Il browser ti chiederà conferma: non posso scaricarlo di nascosto.</p><button class="btn pri" id="dlBk">Scarica il file di backup</button><div class="msg" id="dlMsg"></div></div>'+
    '<div class="card" style="padding:14px"><h2 style="margin-top:0">Azzera</h2><p class="msg">Cancella tutti i progressi su questo dispositivo.</p><button class="btn" id="rst">Azzera i progressi</button><span id="rstConf" hidden> <button class="btn pri" id="rstYes">Sì, azzera</button> <button class="btn" id="rstNo">No</button></span></div>';
}
function showToast(msg,undo){
  var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.className="toast";t.setAttribute("role","status");document.body.appendChild(t);}
  t.innerHTML="<span></span>"+(undo?'<button id="toastUndo">Annulla</button>':"");t.firstChild.textContent=msg;t.hidden=false;
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true;undoS=null;},7000);
}
function bookDo(msg,fn){undoS=clone(S);fn();save();render();showToast(msg,true);}
function clearBook(b){
  var re=function(r){var p=parseAny(r);return !p||p.b!==b;};
  S.pre=S.pre.filter(re);S.extra=S.extra.filter(re);delete S.rr[b];
  for(var t=0;t<3;t++){S["d"+t]=S["d"+t].filter(function(i){return re(S.ovr[t+":"+i]||TR[t][i]);});}
}
function render(){
  try{renderTop();
    var v={oggi:viewOggi,libri:viewLibri,serie:viewSerie,piano:viewPiano,dati:viewDati}[tab]();
    var mn=document.getElementById("main");mn.className=animateNext?"enter":"";animateNext=false;mn.innerHTML=v;
    if(tab==="piano"){var c=document.querySelector(".pr.c"),pl=document.getElementById("plist");if(c&&pl)pl.scrollTop=c.offsetTop-pl.offsetTop-80;}
  }catch(e){showErr(e.message+(e.stack?"\n"+e.stack.split("\n")[1]:""));}
}

/* ---------- eventi ---------- */
document.addEventListener("click",function(e){
  var el=e.target.closest("button,input");if(!el)return;var D=el.dataset;
  if(D.tab){animateNext=true;tab=D.tab;lsSet("dat5_tab",tab);render();return;}
  if(D.edit!==undefined){var t=+D.edit;editOpen[t]=!editOpen[t];msgs[t]="";render();return;}
  if(D.nav!==undefined){var t2=+D.nav,n=S["v"+t2]+ +D.d;if(n>=0&&n<TR[t2].length){S["v"+t2]=n;save();render();}return;}
  if(D.go!==undefined){doGo(+D.go);return;}
  if(D.split!==undefined){doSplit(+D.split);return;}
  if(D.unsplit!==undefined){var u=+D.unsplit;delete S.ovr[u+":"+S["v"+u]];save();render();return;}
  if(D.ch){var key=D.ch+" "+D.c,lst=S.rr[D.ch]?S.rr[D.ch].items:S.pre,k=lst.indexOf(key);if(k>=0)lst.splice(k,1);else lst.push(key);save();render();return;}
  if(D.all){bookDo(D.all+" segnato come letto.",function(){if(S.rr[D.all])S.rr[D.all].items.push(D.all);else S.pre.push(D.all);});return;}
  if(D.clear){confB=D.clear;render();return;}
  if(D.clearNo){confB=null;render();return;}
  if(D.clearYes){var bb=D.clearYes;confB=null;bookDo(bb+" azzerato: tutti i capitoli tornano da leggere.",function(){clearBook(bb);});return;}
  if(el.id==="toastUndo"){if(undoS){S=normalize(undoS);undoS=null;save();render();var tt=document.getElementById("toast");if(tt)tt.hidden=true;}return;}
  if(D.reread){bookDo(D.reread+": parte la rilettura (giro "+((S.rr[D.reread]?S.rr[D.reread].n:0)+2)+").",function(){S.rr[D.reread]={n:(S.rr[D.reread]?S.rr[D.reread].n:0)+1,items:[]};});return;}
  if(D.unre){var bu=D.unre;bookDo("Rilettura di "+bu+" annullata.",function(){var r0=S.rr[bu];if(r0&&r0.n>1){r0.n--;r0.items=[bu];}else delete S.rr[bu];});return;}
  if(D.setstart){var sd=document.getElementById("stDate").value,td=todayISO();
    if(!sd||sd>td){serieMsg="!Scegli una data valida, non nel futuro.";render();return;}
    var nd=0;bookDo("Inizio salvato: "+fmtIT(sd)+". Segnati tutti i giorni fino a ieri.",function(){S.start=sd;for(var dd=sd;dd<td;dd=addDays(dd,1)){if(S.act.indexOf(dd)<0){S.act.push(dd);}}S.act.sort();});serieMsg="";return;}
  if(D.setstreak){var n=parseInt(document.getElementById("stN").value,10),td2=todayISO();
    if(!n||n<1||n>400){serieMsg="!Scrivi un numero tra 1 e 400.";render();return;}
    bookDo("Serie impostata: "+n+" giorni fino a ieri.",function(){for(var k=1;k<=n;k++){var dd=addDays(td2,-k);if(S.act.indexOf(dd)<0)S.act.push(dd);}S.act.sort();if(!S.start||S.start>addDays(td2,-n))S.start=addDays(td2,-n);});serieMsg="";return;}
  if(D.pt!==undefined){planTrack=+D.pt;render();return;}
  if(D.pi!==undefined){S["v"+planTrack]=+D.pi;save();tab="oggi";animateNext=true;lsSet("dat5_tab",tab);render();return;}
  if(D.snap){var sn=readSnaps().filter(function(x){return x.d===D.snap})[0];if(sn){S=normalize(sn.s);lastSnap=0;save();render();}return;}
  if(el.id==="dlBk"){var m0=document.getElementById("dlMsg");
    (window.claude&&window.claude.use?window.claude.use("downloads"):Promise.resolve({save:function(r){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([r.data],{type:"application/json"}));a.download=r.filename;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);return Promise.resolve();}})).then(function(dl){if(!dl){m0.textContent="Il download non è disponibile qui: usa il codice di backup.";return;}
      return dl.save({filename:"aurora-tramonto-backup-"+todayISO()+".json",data:JSON.stringify(S)}).then(function(){lsSet("dat5_lastfile",String(Date.now()));m0.textContent="File salvato.";}).catch(function(e){m0.textContent=e&&e.code==="declined"?"Annullato.":"Non sono riuscito a salvare il file.";});
    }).catch(function(){m0.textContent="Il download non è disponibile qui.";});return;}
  if(el.id==="bkOut"){var ta=document.getElementById("bkText");ta.value=btoa(unescape(encodeURIComponent(JSON.stringify(S))));ta.select();var ok=false;try{ok=document.execCommand("copy");}catch(x){}
    document.getElementById("bkMsg").textContent=ok?"Codice copiato. Incollalo in Note.":"Copia il codice e conservalo in Note.";return;}
  if(el.id==="bkIn"){var tx=document.getElementById("bkText").value.trim(),m=document.getElementById("bkMsg");
    try{var o=tx.charAt(0)==='{'?JSON.parse(tx):JSON.parse(decodeURIComponent(escape(atob(tx))));
      if(o&&o.refs){S=migrate({refs:o.refs,done:o.done,pos:o.pos,act:o.activity});} /* codice del vecchio formato */
      else if(o&&o.d0){S=normalize(o);} else throw new Error("codice non riconosciuto");
      save();render();}catch(x){m.textContent="Codice non valido: "+x.message;}return;}
  if(el.id==="rst"){document.getElementById("rstConf").hidden=false;el.hidden=true;return;}
  if(el.id==="rstNo"){document.getElementById("rstConf").hidden=true;document.getElementById("rst").hidden=false;return;}
  if(el.id==="rstYes"){S=normalize(fresh());save();render();return;}
});
document.addEventListener("change",function(e){
  var el=e.target;if(el.dataset&&el.dataset.chk!==undefined){var t=+el.dataset.chk;setDone(t,S["v"+t],el.checked);render();}
});
function doGo(t){
  var inp=document.getElementById("go"+t),ref=inp.value.trim().replace(/\s+/g," ");
  var p=parseAny(ref);
  if(!p){msgs[t]="!Non riconosco «"+ref+"». Scrivi per esempio Isaia 22 o Galati 5:1.";render();return;}
  var i=findIdx(t,ref);
  if(i<0){msgs[t]="!Questo passo non è nella lettura "+NAMES[t]+".";render();return;}
  S["v"+t]=i;msgs[t]="";save();render();
}
function doSplit(t){
  var i=S["v"+t],ref=curRef(t,i),p=parseAny(ref),stop=parseInt(document.getElementById("sv"+t).value,10);
  if(!p||p.c1!==p.c2||!p.v1&&p.v1!==0&&false){}
  if(!p||p.c1!==p.c2){msgs[t]="!Posso dividere solo letture di un capitolo. Questa è «"+ref+"».";render();return;}
  var tot=BV[p.b][p.c1-1],v1=p.v1||1,v2=p.v2||tot;
  if(!stop||stop<v1||stop>=v2){msgs[t]="!Scrivi un versetto tra "+v1+" e "+(v2-1)+".";render();return;}
  S.extra.push(fmt(p.b,p.c1,v1,stop));if(S.rr[p.b])S.rr[p.b].items.push(fmt(p.b,p.c1,v1,stop));
  S.ovr[t+":"+i]=fmt(p.b,p.c1,stop+1,v2);
  var d=todayISO();if(S.act.indexOf(d)<0){S.act.push(d);S.act.sort();}
  msgs[t]="Segnato fino al versetto "+stop+". Resta da leggere "+S.ovr[t+":"+i]+".";
  save();render();
}

render();
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(placeInd);
idbOpen(function(){idbGet(function(r){if(r){try{adopt(JSON.parse(r));}catch(e){}}if(!raw0&&S.ts===0){}});idbPut(S);});
if(migratedFromOld||!raw0){save();}
initCloud();
})();
</script>
